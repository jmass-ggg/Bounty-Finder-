name: CI

on:
  push:
    branches: [main, feat/production-gmail-alerts]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Offline tests and project checks
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/ruff check .
          .venv/bin/python -m pip check
          .venv/bin/python -m bountyradar --help
          git diff --check
          bash -n scripts/install.sh scripts/uninstall.sh
      - name: Validate systemd unit syntax without installation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/units" data
          for unit in deployment/systemd/bountyradar.{service,timer}; do
            sed "s|/home/james/bounty/bountyradar|$GITHUB_WORKSPACE|g" "$unit" > "$RUNNER_TEMP/units/$(basename "$unit")"
          done
          systemd-analyze verify --man=no "$RUNNER_TEMP/units/bountyradar.service" "$RUNNER_TEMP/units/bountyradar.timer"
